name: Build Linux (aji)

# The Linux release leg: builds libaji.so + libaji_trt.so (TensorRT/CUDA backend) on the
# Ubuntu 22.04 baseline image and publishes aji-linux-x64.tar.zst on the release tag. The
# mpv-upscale-2x_animejanai assembler downloads this (InstallAji). Dispatched by hand from main
# with the tag; this run creates the release, the Windows zips are uploaded to it afterwards:
#   gh workflow run build-linux.yml -R the-database/animejanai-inference --ref main -f release_tag=v0.26.0
#
# Also publishes aji-encode-linux-x64.tar.zst: aji_encode plus the FFmpeg shared libraries it
# links, for VideoJaNai. It is a separate asset so the player package does not carry ~100 MB of
# libav it never loads.
#
# The dependency pins (TensorRT, FFmpeg) and the build itself live in
# .github/actions/linux-build, which ci.yml runs on every PR and push to main.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (matches AjiVersion in the assembler), e.g. v0.26.0'
        required: true
      replace_assets:
        description: 'Overwrite the Linux assets the release already has'
        type: boolean
        default: false

jobs:
  # Before the build: refuse a malformed tag, and refuse to overwrite an existing release's
  # Linux assets unless replace_assets is set (re-running a leg that failed before publishing
  # needs no override, since nothing was uploaded).
  check-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Check the tag
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.release_tag }}
        REPLACE: ${{ inputs.replace_assets }}
      run: |
        [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::not a release tag: $TAG"; exit 1; }
        if have="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null)"; then
          echo "$TAG already exists"
          if grep -qxE 'aji-(encode-)?linux-x64\.tar\.zst' <<< "$have"; then
            if [ "$REPLACE" != true ]; then
              echo "::error::$TAG already has Linux assets; dispatch with replace_assets=true to overwrite them"
              exit 1
            fi
            echo "::warning::replacing the Linux assets of $TAG"
          fi
        fi

  build-linux:
    needs: check-tag
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/the-database/animejanai-linux-build:ubuntu2204
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      packages: read
    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/linux-build

    - name: CPU-only tests
      run: ctest --test-dir build -L cpu --output-on-failure

    - name: Stage + tar (flat, extracts into animejanai/inference)
      run: |
        mkdir -p stage
        cp build/libaji.so build/libaji_trt.so build/aji_harness build/aji_kernel_test stage/
        chmod +x stage/*
        tar --zstd -C stage -cf aji-linux-x64.tar.zst .

    - name: Stage + tar aji_encode (flat, extracts into animejanai/inference)
      shell: bash
      run: |
        set -euxo pipefail
        mkdir -p stage-encode
        cp build/aji_encode stage-encode/
        # the libav sonames aji_encode needs, dereferenced (libavcodec.so.63 ...)
        for f in "$FFMPEG_ROOT"/lib/lib*.so.*; do
          if [[ "$f" =~ \.so\.[0-9]+$ ]]; then cp -L "$f" stage-encode/; fi
        done
        cp "$FFMPEG_ROOT/LICENSE.txt" stage-encode/ffmpeg_LICENSE.txt
        # libaji.so, libaji_trt.so, cudart and the libav libs all sit beside it
        patchelf --set-rpath '$ORIGIN' stage-encode/aji_encode stage-encode/lib*.so.*
        chmod +x stage-encode/aji_encode
        ldd stage-encode/aji_encode | grep -E 'libav|libsw|not found' || true
        tar --zstd -C stage-encode -cf aji-encode-linux-x64.tar.zst .

    # allowUpdates: the Windows zips may already be on the release; check-tag has made sure
    # this doesn't overwrite Linux assets by accident. A new tag is created on the built commit.
    - name: Publish release
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ inputs.release_tag }}
        name: ${{ inputs.release_tag }}
        commit: ${{ github.sha }}
        draft: false
        prerelease: false
        allowUpdates: true
        artifacts: aji-linux-x64.tar.zst,aji-encode-linux-x64.tar.zst
        token: ${{ secrets.GITHUB_TOKEN }}
