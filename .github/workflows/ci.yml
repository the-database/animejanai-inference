name: CI

# Builds libaji on Windows and Linux and runs the CPU-only tests (`ctest -L cpu`, plus the
# Windows dispatcher/release-script checks). Hosted runners have no GPU, so the GPU tests
# (`ctest -L gpu`, the harnesses, sanity/*.py) are built but not run. Publishes nothing: the
# Linux release is build-linux.yml, the Windows release is built by hand (docs/BUILD-WINDOWS.md).
# Dispatch it on a branch to get Windows test binaries (the aji-windows-test artifact).
on:
  pull_request:
    paths: &build-inputs
      - 'src/**'
      - 'include/**'
      - 'sanity/**'
      - 'tools/**'
      - 'ci/**'
      - 'CMakeLists.txt'
      - '.github/actions/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths: *build-inputs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      # CUDA, TensorRT's headers/import libs, ONNX Runtime and DirectML (~2 GB to fetch,
      # mostly the TensorRT zip). tools/build-windows-test.ps1 skips what is already there.
      - uses: actions/cache@v6
        with:
          path: build-deps
          key: aji-windows-deps-${{ hashFiles('ci/windows/dependencies.json') }}-v3
      - name: Build dispatcher, TensorRT and DirectML backends, analysis and tests
        shell: pwsh
        run: ./tools/build-windows-test.ps1
      - name: CPU-only tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ctest --test-dir build -L cpu --output-on-failure
          python sanity/half_isa_check.py build/CMakeFiles/aji_half_test.dir/src/core/half_f16c.cpp.obj
          # cached-only dispatch without a GPU or backend DLLs
          python tools/test-stream-policy-dispatch.py build/Release/aji.dll
          python tools/test-release-configuration.py
          ./tools/test-release-packaging.ps1 -OutputDirectory "$env:RUNNER_TEMP/release-packaging-check"
          'GPU tests (`ctest -L gpu`, aji_kernel_test, the harnesses) were built but not run: no GPU on hosted runners.' >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        with:
          name: aji-windows-test
          path: |
            build/Release/
            build/build-info.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: aji-windows-build-logs
          path: build/CMakeFiles/*.yaml

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/the-database/animejanai-linux-build:ubuntu2204
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-build
      - name: CPU-only tests
        run: |
          ctest --test-dir build -L cpu --output-on-failure
          echo 'GPU tests (`ctest -L gpu`, aji_kernel_test, the harnesses) were built but not run: no GPU on hosted runners.' >> "$GITHUB_STEP_SUMMARY"
