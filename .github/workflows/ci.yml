name: CI

# Builds libaji on Windows and Linux and runs the CPU-only tests (`ctest -L cpu`, plus the
# Windows dispatcher/release-script checks). Hosted runners have no GPU, so the GPU tests
# (`ctest -L gpu`, the harnesses, sanity/*.py) are built but not run. Publishes nothing: the
# Linux release is build-linux.yml, the Windows release is built by hand (docs/BUILD-WINDOWS.md).
# Dispatch it on a branch to get Windows test binaries (the aji-windows-test artifact).
on:
  pull_request:
    paths: &build-inputs
      - 'src/**'
      - 'include/**'
      - 'sanity/**'
      - 'tools/**'
      - 'ci/**'
      - 'CMakeLists.txt'
      - '.github/actions/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths: *build-inputs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      # CUDA, TensorRT's headers/import libs, ONNX Runtime and DirectML (~2 GB to fetch,
      # mostly the TensorRT zip). tools/build-windows-test.ps1 skips what is already there.
      - uses: actions/cache@v6
        with:
          path: build-deps
          key: aji-windows-deps-${{ hashFiles('ci/windows/dependencies.json') }}-v3
      - name: Build dispatcher, TensorRT and DirectML backends, analysis and tests
        shell: pwsh
        run: ./tools/build-windows-test.ps1
      - name: CPU-only tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ctest --test-dir build -L cpu --output-on-failure
          python sanity/half_isa_check.py build/CMakeFiles/aji_half_test.dir/src/core/half_f16c.cpp.obj
          # cached-only dispatch without a GPU or backend DLLs
          python tools/test-stream-policy-dispatch.py build/Release/aji.dll
          python tools/test-release-configuration.py
          ./tools/test-release-packaging.ps1 -OutputDirectory "$env:RUNNER_TEMP/release-packaging-check"
          'GPU tests (`ctest -L gpu`, aji_kernel_test, the harnesses) were built but not run: no GPU on hosted runners.' >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        with:
          name: aji-windows-test
          path: |
            build/Release/
            build/build-info.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: aji-windows-build-logs
          path: build/CMakeFiles/*.yaml

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/the-database/animejanai-linux-build:ubuntu2204
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-build
      - name: CPU-only tests
        run: |
          ctest --test-dir build -L cpu --output-on-failure
          echo 'GPU tests (`ctest -L gpu`, aji_kernel_test, the harnesses) were built but not run: no GPU on hosted runners.' >> "$GITHUB_STEP_SUMMARY"

  # The Vulkan backend (AJI_VULKAN=ON, in development) without CUDA: every shader compiled and
  # checked (aji_vk_spirv_test in ctest -L cpu), libaji_vk.so and the Vulkan tools built, and
  # the same targets cross-built for android-arm64 with the runner's NDK. No GPU, so the Vulkan
  # GPU tests (aji_vk_conv_test, the harnesses) are built but not run.
  vulkan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: glslc and the Vulkan headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends glslc libvulkan-dev ninja-build
      - name: Build (Linux, AJI_CUDA=OFF, AJI_VULKAN=ON)
        run: |
          cmake -S . -B build-vk -G Ninja -DCMAKE_BUILD_TYPE=Release -DAJI_CUDA=OFF -DAJI_VULKAN=ON
          cmake --build build-vk
      - name: CPU-only tests
        run: ctest --test-dir build-vk -L cpu --output-on-failure
      - name: Build for android-arm64 (NDK)
        run: |
          # the Vulkan headers alone: all of /usr/include would shadow the NDK's libc headers
          mkdir -p vkinc && cp -r /usr/include/vulkan /usr/include/vk_video vkinc/
          cmake -S . -B build-android -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-31 \
            -DAJI_CUDA=OFF -DAJI_VULKAN=ON -DAJI_GLSLC="$(command -v glslc)" -DAJI_VK_INCLUDE="$PWD/vkinc"
          cmake --build build-android --target aji_vk aji_vk_model_test aji_harness_vk aji_image
          echo 'Vulkan: built for Linux and android-arm64; the GPU tests (`aji_vk_conv_test`, the harnesses) were not run (no GPU).' >> "$GITHUB_STEP_SUMMARY"
