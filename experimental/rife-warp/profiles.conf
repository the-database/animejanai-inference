[global]
config_version=3
backend=TensorRT
logging=yes
default_slot=1
trt_engine_settings=--builderOptimizationLevel=5 --optShapes=input:%video_resolution% --skipInference

[slot_1]
profile_name=Balanced + RIFE Original
chain_1_min_resolution=0x0
chain_1_max_resolution=infxinf
chain_1_min_fps=0
chain_1_max_fps=inf
chain_1_model_1_name=2x_AnimeJaNai_HD_V3.1_Balanced_SPANF3_b8f64_unshuffle_fp16
chain_1_model_1_resize_factor_before_upscale=100
chain_1_model_1_resize_height_before_upscale=0
chain_1_rife=yes
chain_1_rife_model=422
chain_1_rife_factor_numerator=2
chain_1_rife_factor_denominator=1
chain_1_rife_before_upscale=yes
chain_1_rife_scene_detect_threshold=0.150
chain_1_rife_fp16_warp=no

[slot_2]
profile_name=Balanced + RIFE Warp
chain_1_min_resolution=0x0
chain_1_max_resolution=infxinf
chain_1_min_fps=0
chain_1_max_fps=inf
chain_1_model_1_name=2x_AnimeJaNai_HD_V3.1_Balanced_SPANF3_b8f64_unshuffle_fp16
chain_1_model_1_resize_factor_before_upscale=100
chain_1_model_1_resize_height_before_upscale=0
chain_1_rife=yes
chain_1_rife_model=422
chain_1_rife_factor_numerator=2
chain_1_rife_factor_denominator=1
chain_1_rife_before_upscale=yes
chain_1_rife_scene_detect_threshold=0.150
chain_1_rife_fp16_warp=yes
